name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties points aapt2 to the Termux binary, which doesn't exist on the runner
      - name: Drop Termux aapt2 override
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: IconRecolor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Name the APK after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "IconRecolor-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IconRecolor-${{ github.ref_name }}.apk
          generate_release_notes: true
